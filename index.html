<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requerimento</title>
</head>
<body>
    <header>
       Requerimento
    </header> <br>
    <main>
        <form>
            <fieldset>
                <legend>  Guia de Requerimento </legend>
                <label for="prot"> Protocolo n.°</label>
                <input type="text" id="prot" name="prot" required> <br> <br>                

                <label for="nome-requerente">Nome</label>
                <input type="text" id="nome-requerente" name="nome_requerente" required><br>

                 <label for="matricula">N° de matricula</label>
                <input type="password" id="matricula" name="matricula" required><br>  

                 <label for="data">Data nascimento</label>
                <input type="date" id="data" name="data" required>  

                 <label for="cidade natal">Naturalidade</label>
                <input type= "text" id="cidade natal" name="cidade natal" required><br>
                
                <label for="pais">Filiação</label>
                <input type= "text" id="pais" name="pais" required><br>

                <label for="curso">Curso</label>
                <input type="search" id="curso" name="curso" list="cursos" required>
                <datalist id="cursos">
                    <option value="Bacharelado de Sistmas de Informação"></option>
                    <option value="Bacharelado de Engenharia Eletrica"></option>
                    <option value="Bacharelado de Engenharia Mecânica"></option>
                    <option value="Lienciatura em Matemática"></option>
                    <option value="Lienciatura em Fisica"></option>
                    <option value="Tecnólogo em mecatrônica"></option>
                    <option value="Administração"></option>
                    <option value="Tecnico em Informatica"></option>
                    <option value="Tecnico em Eletrotecnica"></option>
                    <option value="Tecnico em Mecânica"></option>
                </datalist>

                <label for="sem">Periodo</label>
                <input type= "number" id="sem" name="sem" required>

                <label for="turno">turno</label>
                <input type= "search" id="turno" name="turno" list="turnos"><br>
                <datalist>
                    <option value="Manhã"></option>
                    <option value="Tarde"></option>
                    <option value="Noite"></option>
                    <option value="Integral"></option>
                </datalist> <br>

                <label for="telefone">telefone</label>
                <input type= "text" id="telefone" name="telefone" required>

                <label for="email">E-mail</label>
                <input type= "email" id="email" name="email" required><br>
            </fieldset>

            <fieldset>
                <legend>Assinale:</legend>
                <label><input type="checkbox"></label>  <br>
                <label><input type="checkbox"> Aproveitamento de disciplina(s)</label> <br>
                <label><input type="checkbox">Matrícula fora do prazo</label> <br>
                <label><input type="checkbox"> Cancelamento de matrícula</label><br>
                <label><input type="checkbox"> Colação de grau/ Colação especial</label><br>
                <label><input type="checkbox"> </label><br>
                <label><input type="checkbox"> Diploma</label><br>
                <label><input type="checkbox"> Historico Escolar</label><br>
                <label><input type="checkbox"> Reabertura de matrícula</label><br>
                <label><input type="checkbox"></label><br>
                <label><input type="checkbox"></label><br>
                <label><input type="checkbox">Trancamento de disciplina</label><br>
                <label><input type="checkbox"> Trancamento de matrícula</label><br>
                <label><input type="checkbox"></label><br>
                <label><input type="checkbox"></label><br>
                <label><input type="checkbox">Reajuste</label><br>
                 <label><input type="checkbox">Recorreçao de prova</label><br>
                <label><input type="checkbox"></label><br>
                <label><input type="checkbox"></label><br>
                <label><input type="checkbox"></label><br>
                <label><input type="checkbox"></label><br>
                <label for=""><input type="checkbox"> Outro (especificar)</label><br>

            </fieldset>
        </form>
    </main>    
</body>
</html>
